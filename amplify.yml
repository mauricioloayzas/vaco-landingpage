version: 1
frontend:
  phases:
    build:
      commands:
        - aws s3 sync batches/ s3://profiles-hayayaku/batches/ --delete --cache-control "max-age=0,no-cache"
        - aws s3 sync assets/images/ s3://profiles-hayayaku/assets/images/ --delete --cache-control "max-age=86400"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
